plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven { url 'https://jitpack.io' }
	maven { url 'https://raw.githubusercontent.com/kusaanko/maven/main/' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"streamchat" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
	// TikTok Live Java
	implementation 'com.github.jwdeveloper.TikTok-Live-Java:Client:1.11.0-Release'
	include 'com.github.jwdeveloper.TikTok-Live-Java:Client:1.11.0-Release'
	
	implementation 'com.github.jwdeveloper.TikTok-Live-Java:API:1.11.0-Release'
	include 'com.github.jwdeveloper.TikTok-Live-Java:API:1.11.0-Release'
	
	implementation 'com.github.jwdeveloper.DepenDance:DepenDance-Full:0.0.18-Release'
	include 'com.github.jwdeveloper.DepenDance:DepenDance-Full:0.0.18-Release'
	implementation 'com.github.jwdeveloper.DepenDance:Injector:0.0.18-Release'
	include 'com.github.jwdeveloper.DepenDance:Injector:0.0.18-Release'
	implementation 'com.github.jwdeveloper.DepenDance:Decorator:0.0.18-Release'
	include 'com.github.jwdeveloper.DepenDance:Decorator:0.0.18-Release'

	implementation 'org.java-websocket:Java-WebSocket:1.5.5'
	include 'org.java-websocket:Java-WebSocket:1.5.5'

	implementation 'com.google.protobuf:protobuf-java:4.26.1'
	include 'com.google.protobuf:protobuf-java:4.26.1'

	// YouTube Live Chat (no official API key required)
	implementation 'com.github.kusaanko:YouTubeLiveChat:2.0'
	include 'com.github.kusaanko:YouTubeLiveChat:2.0'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
